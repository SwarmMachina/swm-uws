name: Feature request
description: Propose a focused improvement to swm-uws
title: 'feat: '
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: I reviewed the documented support matrix and unsupported features.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete use case or limitation should this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API and behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other designs you considered.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and performance impact
      description: Note expected effects on the upstream API surface, native memory, latency, throughput, or package size.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, measurements, or links that help explain the request.
