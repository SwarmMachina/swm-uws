name: CI

on:
  workflow_dispatch:
    inputs:
      publish_auth:
        description: Use npm OIDC, or the emergency token fallback when explicitly dispatching a tag
        required: true
        type: choice
        default: oidc
        options:
          - oidc
          - token
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify workflow commit belongs to master
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install C++ quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-format-18 clang-tidy-18

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm run audit:dependencies

      - name: Check shared standards
        run: npm run check

      - name: Verify vendored sources
        run: npm run deps:check:vendor

      - name: Fuzz patched wire parsers under ASan and UBSan
        env:
          SWM_PARSER_FUZZ_CXX: clang++-18
          SWM_PARSER_FUZZ_SECONDS: 30
        run: npm run test:fuzz:parsers

      - name: Verify generated benchmark report
        run: npm run bench:report:check

  linux:
    name: Linux x64 / Node.js ${{ matrix.node }}
    runs-on:
      group: swm-ci
      labels: swm-linux
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            abi: 127
            image_digest: sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
          - node: 24
            abi: 137
            image_digest: sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up manifest generator
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Require native x86-64 PGO host
        shell: bash
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "Linux PGO training must run natively on x86-64, got $arch" >&2
            exit 1
          fi

      - name: Build and smoke-test native addon on Bookworm
        shell: bash
        run: |
          rm -rf prebuilds/linux-x64-glibc

          node_tag="node:${{ matrix.node }}-bookworm"
          node_image="${node_tag}@${{ matrix.image_digest }}"
          for attempt in 1 2 3; do
            if docker pull --platform linux/amd64 "$node_image"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to pull $node_image after $attempt attempts" >&2
              exit 1
            fi

            sleep "$((attempt * 5))"
          done

          docker tag "$node_image" "$node_tag"

          docker build \
            --platform linux/amd64 \
            --pull=false \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            --target prebuild \
            --output type=local,dest=prebuilds \
            .

      - name: Verify prebuild
        shell: bash
        run: |
          path="prebuilds/linux-x64-glibc/node-v${{ matrix.abi }}.node"
          test -f "$path"
          file "$path" | grep -q 'ELF 64-bit'
          sha256sum "$path"

      - name: Verify Bookworm ABI ceilings
        shell: bash
        run: |
          path="prebuilds/linux-x64-glibc/node-v${{ matrix.abi }}.node"

          check_ceiling() {
            prefix="$1"
            ceiling="$2"
            required="$(strings "$path" | grep -oE "${prefix}_[0-9]+(\.[0-9]+)+" | sort -Vu | tail -1)"
            test -n "$required"

            highest="$(printf '%s\n%s\n' "$required" "$ceiling" | sort -Vu | tail -1)"
            if [ "$highest" != "$ceiling" ]; then
              echo "$path requires $required, above the Bookworm ceiling $ceiling" >&2
              exit 1
            fi

            echo "$path requires at most $required (Bookworm ceiling: $ceiling)"
          }

          glibcxx_required="$(strings "$path" | grep -oE 'GLIBCXX_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -1 || true)"
          if [ -n "$glibcxx_required" ]; then
            check_ceiling GLIBCXX GLIBCXX_3.4.30
          else
            dynamic_dependencies="$(ldd "$path")"
            if grep -qE 'libstdc\+\+|libgcc_s' <<<"$dynamic_dependencies"; then
              echo "$path has dynamic C++ runtime dependencies without GLIBCXX markers" >&2
              exit 1
            fi
            echo "$path statically links the C++ runtime"
          fi
          check_ceiling GLIBC GLIBC_2.36

      - name: Record prebuild digest and toolchain
        shell: bash
        env:
          SWM_RELEASE_ARTIFACT: prebuilds/linux-x64-glibc/node-v${{ matrix.abi }}.node
          SWM_RELEASE_BUILDER: node:${{ matrix.node }}-bookworm@${{ matrix.image_digest }}
          SWM_RELEASE_COMPILER: clang-18
          SWM_RELEASE_PROFILE: PGO+LTO
        run: |
          node_image="node:${{ matrix.node }}-bookworm@${{ matrix.image_digest }}"
          export SWM_RELEASE_NODE_VERSION
          export SWM_RELEASE_NPM_VERSION
          SWM_RELEASE_NODE_VERSION="$(docker run --rm --platform linux/amd64 "$node_image" node --version)"
          SWM_RELEASE_NPM_VERSION="$(docker run --rm --platform linux/amd64 "$node_image" npm --version)"
          node scripts/release/release-artifacts.js create-prebuild

      - name: Upload ABI prebuild
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-node-v${{ matrix.abi }}
          path: |
            prebuilds/linux-x64-glibc/node-v${{ matrix.abi }}.node
            prebuilds/linux-x64-glibc/node-v${{ matrix.abi }}.node.build.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  windows:
    name: Windows x64 / Node.js ${{ matrix.node }}
    runs-on:
      group: swm-ci
      labels: swm-win
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            abi: 127
          - node: 24
            abi: 137

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install build dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build:native

      - name: Run package smoke test
        run: npm test

      - name: Run raw V8 HTTP smoke test
        run: npm run test:v8-http

      - name: Run raw V8 WebSocket smoke test
        run: npm run test:v8-ws

      - name: Verify runtime-only installation
        run: |
          Remove-Item -Recurse -Force build, node_modules
          npm ci --omit=dev
          if (Test-Path node_modules/@swarmmachina/standards) {
            throw "@swarmmachina/standards leaked into the runtime installation"
          }
          if (Test-Path node_modules/node-addon-api) {
            throw "node-addon-api leaked into the runtime installation"
          }
          if (Test-Path node_modules/node-gyp) {
            throw "node-gyp leaked into the runtime installation"
          }
          node test/installed-smoke.js

      - name: Verify prebuild
        run: |
          $path = "prebuilds/win32-x64/node-v${{ matrix.abi }}.node"
          if (-not (Test-Path $path)) {
            throw "Missing expected prebuild: $path"
          }
          Get-Item $path
          Get-FileHash -Algorithm SHA256 $path

      - name: Record prebuild digest and toolchain
        env:
          SWM_RELEASE_ARTIFACT: prebuilds/win32-x64/node-v${{ matrix.abi }}.node
          SWM_RELEASE_BUILDER: GitHub Actions self-hosted Windows x64
          SWM_RELEASE_COMPILER: MSVC via node-gyp
          SWM_RELEASE_PROFILE: release
        run: node scripts/release/release-artifacts.js create-prebuild

      - name: Upload ABI prebuild
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-node-v${{ matrix.abi }}
          path: |
            prebuilds/win32-x64/node-v${{ matrix.abi }}.node
            prebuilds/win32-x64/node-v${{ matrix.abi }}.node.build.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            abi: 127
            arch: arm64
            binary_arch: arm64
            runner: macos-15
          - node: 24
            abi: 137
            arch: arm64
            binary_arch: arm64
            runner: macos-15
          - node: 22
            abi: 127
            arch: x64
            binary_arch: x86_64
            runner: macos-15-intel
          - node: 24
            abi: 137
            arch: x64
            binary_arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}

      - name: Install build dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build:native

      - name: Run package smoke test
        run: npm test

      - name: Run raw V8 HTTP smoke test
        run: npm run test:v8-http

      - name: Run raw V8 WebSocket smoke test
        run: npm run test:v8-ws

      - name: Verify runtime-only installation
        run: |
          rm -rf build node_modules
          npm ci --omit=dev
          test ! -d node_modules/@swarmmachina/standards
          test ! -d node_modules/node-gyp
          node test/installed-smoke.js

      - name: Verify prebuild
        run: |
          path="prebuilds/darwin-${{ matrix.arch }}/node-v${{ matrix.abi }}.node"
          test -f "$path"
          file "$path" | grep -q 'Mach-O 64-bit'
          test "$(lipo -archs "$path")" = "${{ matrix.binary_arch }}"
          shasum -a 256 "$path"

      - name: Record prebuild digest and toolchain
        env:
          SWM_RELEASE_ARTIFACT: prebuilds/darwin-${{ matrix.arch }}/node-v${{ matrix.abi }}.node
          SWM_RELEASE_BUILDER: GitHub Actions ${{ matrix.runner }}
          SWM_RELEASE_COMPILER: Apple Clang via node-gyp
          SWM_RELEASE_PROFILE: release
        run: node scripts/release/release-artifacts.js create-prebuild

      - name: Upload ABI prebuild
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}-node-v${{ matrix.abi }}
          path: |
            prebuilds/darwin-${{ matrix.arch }}/node-v${{ matrix.abi }}.node
            prebuilds/darwin-${{ matrix.arch }}/node-v${{ matrix.abi }}.node.build.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  regression-gate:
    name: PGO performance regression gate
    runs-on:
      group: swm-ci
      labels: swm-linux
    timeout-minutes: 30
    needs:
      - linux

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download PGO+LTO candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-x64-node-v127
          path: prebuilds/linux-x64-glibc

      - name: Install commit-pinned upstream reference
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/uws-reference" \
            --ignore-scripts \
            --no-save \
            "uwebsockets.js@github:uNetworking/uWebSockets.js#dddd8ffd1b2c28a66022160923ca92f064cdacb4"
          reference="$RUNNER_TEMP/uws-reference/node_modules/uwebsockets.js/ESM_wrapper.mjs"
          echo "SWM_UWS_REFERENCE=$reference" >> "$GITHUB_ENV"
          echo "SWM_BENCH_REFERENCE=$reference" >> "$GITHUB_ENV"

      - name: Verify upstream runtime surface
        run: npm run test:compat:upstream

      - name: Run paired PGO benchmark suite against upstream
        run: npm run bench:compare:pgo:linux -- "$RUNNER_TEMP/pgo-benchmark"

      - name: Run request prefetch PGO benchmark
        run: |
          npm run bench:prefetch -- \
            --quick \
            --blocks=4 \
            --connections=100 \
            --pipelining=10 \
            --warmupMs=1000 \
            --durationMs=3000 \
            --workers=4 \
            --output="$RUNNER_TEMP/pgo-benchmark/request-prefetch-node22.json"

      - name: Publish benchmark reports
        if: always()
        run: |
          for report in \
            "$RUNNER_TEMP/pgo-benchmark/report.md" \
            "$RUNNER_TEMP/pgo-benchmark/request-prefetch-node22.md"; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pgo-performance-report
          path: ${{ runner.temp }}/pgo-benchmark/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  package:
    name: Assemble npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - linux
      - windows
      - macos
      - regression-gate

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Download Linux Node.js 22 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-x64-node-v127
          path: prebuilds/linux-x64-glibc

      - name: Download Linux Node.js 24 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-x64-node-v137
          path: prebuilds/linux-x64-glibc

      - name: Download Windows Node.js 22 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-node-v127
          path: prebuilds/win32-x64

      - name: Download Windows Node.js 24 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-node-v137
          path: prebuilds/win32-x64

      - name: Download macOS arm64 Node.js 22 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-node-v127
          path: prebuilds/darwin-arm64

      - name: Download macOS arm64 Node.js 24 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-node-v137
          path: prebuilds/darwin-arm64

      - name: Download macOS x64 Node.js 22 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-x64-node-v127
          path: prebuilds/darwin-x64

      - name: Download macOS x64 Node.js 24 prebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-x64-node-v137
          path: prebuilds/darwin-x64

      - name: Install dependencies
        run: npm ci

      - name: Verify and assemble release manifest
        run: node scripts/release/release-artifacts.js assemble

      - name: Validate release prebuild formats and digests
        run: npm run check:release

      - name: Pack release candidate
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          node scripts/release/release-artifacts.js create-candidate

      - name: Upload combined prebuilds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-prebuilds
          path: prebuilds/**
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swm-uws-release-candidate
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  package-smoke:
    name: Package smoke / ${{ matrix.os }} / Node.js ${{ matrix.node }}
    needs: package
    runs-on:
      group: swm-ci
      labels: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner: swm-linux
            node: 22
            runtime_digest: sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
          - os: ubuntu-24.04
            runner: swm-linux
            node: 24
            runtime_digest: sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
          - os: windows-self-hosted
            runner: swm-win
            node: 22
          - os: windows-self-hosted
            runner: swm-win
            node: 24

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swm-uws-release-candidate
          path: dist

      - name: Verify tested release candidate digest and contents
        shell: bash
        run: node scripts/release/release-artifacts.js verify-candidate

      - name: Install and smoke-test packed package on Bookworm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --memory 1g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            node:${{ matrix.node }}-bookworm-slim@${{ matrix.runtime_digest }} \
            sh -euc '
              tgz="$(find /workspace/dist -name "*.tgz" -type f -print -quit)"
              test -n "$tgz"
              mkdir /tmp/consumer
              cp /workspace/test/installed-smoke.js /tmp/consumer/smoke.mjs
              cd /tmp/consumer
              npm init -y >/dev/null
              npm install "$tgz" --omit=dev --ignore-scripts --no-audit --no-fund
              node smoke.mjs
            '

      - name: Install and smoke-test packed package on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $tgz = Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Filter '*.tgz' -File | Select-Object -First 1
          if (-not $tgz) {
            throw 'Missing packed npm package'
          }
          New-Item -ItemType Directory consumer | Out-Null
          Copy-Item test/installed-smoke.js consumer/smoke.mjs
          Set-Location consumer
          npm.cmd init -y
          npm.cmd install $tgz.FullName --omit=dev
          node smoke.mjs

  package-smoke-macos:
    name: Package smoke / macOS ${{ matrix.arch }} / Node.js ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            arch: arm64
            runner: macos-15
          - node: 24
            arch: arm64
            runner: macos-15
          - node: 22
            arch: x64
            runner: macos-15-intel
          - node: 24
            arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}

      - name: Download npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swm-uws-release-candidate
          path: dist

      - name: Verify tested release candidate digest and contents
        run: node scripts/release/release-artifacts.js verify-candidate

      - name: Install and smoke-test packed package
        shell: bash
        run: |
          tgz="$(find "$GITHUB_WORKSPACE/dist" -name '*.tgz' -type f -print -quit)"
          test -n "$tgz"
          mkdir consumer
          cp test/installed-smoke.js consumer/smoke.mjs
          cd consumer
          npm init -y
          npm install "$tgz" --omit=dev
          node smoke.mjs

  publish:
    name: Publish npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-smoke
      - package-smoke-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install trusted publishing npm CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.15.0

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Verify trusted publishing npm CLI
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && minor < 15)) {
              throw new Error(`npm >= 11.15.0 is required for trusted publishing, got ${process.argv[1]}`)
            }
          ' "$npm_version"

      - name: Download tested npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swm-uws-release-candidate
          path: dist

      - name: Verify tested release candidate digest and contents
        run: node scripts/release/release-artifacts.js verify-candidate

      - name: Check whether the exact package is already published
        id: registry
        shell: bash
        run: |
          tgz="$(find "$GITHUB_WORKSPACE/dist" -name '*.tgz' -type f -print -quit)"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          local_integrity="$(node -e '
            const { createHash } = require("node:crypto")
            const { readFileSync } = require("node:fs")
            process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)
          ' "$tgz")"
          registry_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null || true)"

          if [ -z "$registry_integrity" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$registry_integrity" = "$local_integrity" ]; then
            echo "Exact package already exists; continuing with provenance verification"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Refusing to replace $package_spec with different contents" >&2
            exit 1
          fi

      - name: Publish npm package with trusted publishing
        if: steps.registry.outputs.should_publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_auth == 'oidc')
        shell: bash
        run: |
          tgz="$(find "$GITHUB_WORKSPACE/dist" -name '*.tgz' -type f -print -quit)"
          test -n "$tgz"
          npm publish "$tgz" --access public --provenance

      - name: Publish npm package with emergency token fallback
        if: steps.registry.outputs.should_publish == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token'
        shell: bash
        run: |
          test -n "${NODE_AUTH_TOKEN:-}"
          tgz="$(find "$GITHUB_WORKSPACE/dist" -name '*.tgz' -type f -print -quit)"
          test -n "$tgz"
          npm publish "$tgz" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published integrity and provenance
        shell: bash
        run: |
          tgz="$(find "$GITHUB_WORKSPACE/dist" -name '*.tgz' -type f -print -quit)"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          local_integrity="$(node -e '
            const { createHash } = require("node:crypto")
            const { readFileSync } = require("node:fs")
            process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)
          ' "$tgz")"

          registry_integrity=""
          predicate_type=""
          for attempt in $(seq 1 12); do
            registry_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null || true)"
            predicate_type="$(npm view "$package_spec" dist.attestations.provenance.predicateType 2>/dev/null || true)"
            if [ "$registry_integrity" = "$local_integrity" ] && [ "$predicate_type" = "https://slsa.dev/provenance/v1" ]; then
              break
            fi
            sleep 5
          done

          test "$registry_integrity" = "$local_integrity"
          test "$predicate_type" = "https://slsa.dev/provenance/v1"

          verify_dir="$RUNNER_TEMP/npm-provenance-verify"
          mkdir "$verify_dir"
          npm init --yes --prefix "$verify_dir" >/dev/null
          npm install --prefix "$verify_dir" "$package_spec" --ignore-scripts --no-audit --no-fund
          npm audit signatures --prefix "$verify_dir"
