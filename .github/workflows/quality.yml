name: Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and vendor integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install C++ quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-format-18 clang-tidy-18

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm run audit:dependencies

      - name: Check shared standards
        run: npm run check

      - name: Packed consumer type resolution
        run: npm run test:types

      - name: Package metadata and contents
        run: npm run test:package

      - name: Verify vendored sources
        run: npm run deps:check:vendor

      - name: Verify generated benchmark report
        run: npm run bench:report:check

  native:
    name: Native smoke / Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build:native

      - name: Run package smoke
        run: npm test

      - name: Install commit-pinned upstream reference
        if: matrix.node == 24
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/uws-reference" \
            --ignore-scripts \
            --no-save \
            "uwebsockets.js@github:uNetworking/uWebSockets.js#dddd8ffd1b2c28a66022160923ca92f064cdacb4"
          echo "SWM_UWS_REFERENCE=$RUNNER_TEMP/uws-reference/node_modules/uwebsockets.js/ESM_wrapper.mjs" >> "$GITHUB_ENV"

      - name: Compare runtime surface with pinned upstream
        if: matrix.node == 24
        run: npm run test:compat:upstream

      - name: Run raw V8 HTTP smoke
        run: npm run test:v8-http

      - name: Run raw V8 WebSocket smoke
        run: npm run test:v8-ws

  parser-sanitizers:
    name: Parser sanitizer and fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-18

      - name: Fuzz patched wire parsers under ASan and UBSan
        env:
          SWM_PARSER_FUZZ_CXX: clang++-18
          SWM_PARSER_FUZZ_SECONDS: 30
        run: bash scripts/verify/run-parser-fuzz.sh
